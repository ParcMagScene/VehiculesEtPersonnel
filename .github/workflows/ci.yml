# ─────────────────────────────────────────────────────────────
# ci.yml — Pipeline CI unique (dev + main + PR)
# ─────────────────────────────────────────────────────────────
# Strategie :
#   • Un seul workflow pour push dev/main + PR vers dev/main.
#   • Le deploiement reel est fait localement via `npm run deploy`
#     (PM2). Cette CI sert uniquement de filet de securite.
#   • Jobs bloquants  : lint, syntax-check, smoke-boot, tests (back+front), build
#   • Jobs informatifs: commitlint (PR uniquement), docs:check
#     → declares avec `continue-on-error: true` pour ne pas casser la CI
#       sur un warning cosmetique. Visible en orange dans l'UI GitHub.
#   • La version Node est centralisee dans .github/actions/setup-node-deps
#     (compositie action — npm cache + `npm ci`).
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Annule les runs precedents sur le meme ref (push successifs / PR force-push)
# → reduit le bruit email + accelere la CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & format ────────────────────────────────────────────
  # Bloquant : ESLint (api : --max-warnings=0, web : 0 erreur tolere)
  # + Prettier strict.
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  # ─── Tests backend ────────────────────────────────────────────
  # Bloquant : check syntaxique + smoke boot + node:test.
  test-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: Verification syntaxique (node --check)
        run: npm run check:syntax
      - name: Smoke boot backend
        env:
          JWT_SECRET: smoke-test-secret-key-min-32-chars-long-xx
          DISABLE_SCHEDULER: '1'
        run: npm run smoke-boot
      - name: Tests unitaires backend
        run: npm test

  # ─── Tests frontend ───────────────────────────────────────────
  # Bloquant : Vitest (sans coverage pour rester deterministe).
  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: Tests Vitest
        run: npm run test --workspace=apps/web

  # ─── Build production ─────────────────────────────────────────
  # Bloquant : depend des tests pour ne pas livrer du code casse.
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: Cache Vite
        uses: actions/cache@v5
        with:
          path: |
            apps/web/node_modules/.vite
            apps/web/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json', 'apps/web/vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-
      - name: Build production
        run: npm run build
      - name: Verifier le build
        run: |
          if [ ! -d "apps/web/dist" ]; then
            echo "::error::Le dossier apps/web/dist/ n'a pas ete cree"
            exit 1
          fi
          FILE_COUNT=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          echo "Build OK : $FILE_COUNT fichiers generes"

  # ─── Conventional Commits (PR uniquement, NON BLOQUANT) ───────
  # Informatif — ne casse pas la CI sur un message non conforme.
  commitlint:
    name: Conventional Commits (informatif)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Verifier les messages de commit
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ─── Coherence documentation (NON BLOQUANT) ──────────────────
  # Informatif — un decalage docs/code ne doit pas bloquer la CI.
  docs:
    name: Coherence docs (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: Verifier la coherence docs ↔ code
        run: npm run docs:check

  # ─── Adoption Design System (NON BLOQUANT) ──────────────────
  # Informatif — mesure la dette UI (Stylelint warn-only +
  # ESLint guard-rails warn-only). Voir docs/dashboards/ui-debt.md.
  ui-debt:
    name: Adoption DS (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps
      - name: Stylelint (warn-only)
        # Réellement non bloquant : la dette UI est mesuree, pas verrouillee.
        # `continue-on-error: true` au niveau etape pour que l'UI affiche vert.
        continue-on-error: true
        run: npm run lint:css --workspace=apps/web
      - name: Mesurer la dette UI
        continue-on-error: true
        run: node scripts/measure-ui-debt.mjs --format=summary
