name: ✅ CI main

# Déclenché quand un push arrive sur main (après merge PR dev → main).
# Le déploiement réel est effectué localement via `npm run deploy`.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  # ─── Validation post-merge sur main ───────────────────
  validate:
    name: ✅ Validation post-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint + Prettier
        run: |
          npm run lint
          npm run format:check

      - name: Vérifier la cohérence docs ↔ code
        run: npm run docs:check

      - name: Tests backend
        run: npm test

      - name: Tests frontend
        run: npm run test --workspace=apps/web

      - name: Build production
        run: npm run build

      - name: Vérifier le build
        run: |
          if [ ! -d "apps/web/dist" ]; then
            echo "❌ dist/ manquant"
            exit 1
          fi
          FILE_COUNT=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          echo "✅ Build OK : $FILE_COUNT fichiers"
          echo "ℹ️ Le déploiement réel se fait localement via 'npm run deploy'."
