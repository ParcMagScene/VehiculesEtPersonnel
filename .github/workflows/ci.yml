name: CI — Branche dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# FIX CI : annule les runs précédents sur le même ref (push successifs / PR force-push)
# → réduit le bruit email + accélère la CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Conventional Commits ─────────────────────────────
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Vérifier les messages de commit
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ─── Lint ─────────────────────────────────────────────
  # FIX CI : génère un rapport HTML lisible (artefact) même en cas d'échec.
  # Le build (cf. job `build`) est découplé du lint pour ne plus être skippé
  # sur erreurs cosmétiques.
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint — génération rapport HTML (non bloquant)
        # Toujours produire un rapport, même si le lint plus bas échoue.
        run: |
          mkdir -p reports
          npx --workspace=apps/web eslint . --ext js,jsx \
            -f html -o ../../reports/eslint-web.html || true
          npx --workspace=apps/api eslint . --ext js \
            -f html -o ../../reports/eslint-api.html || true

      - name: ESLint — vérification stricte (échec si erreurs)
        run: npm run lint

      - name: Prettier (vérification)
        run: npm run format:check

      - name: Upload rapport ESLint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: reports/
          retention-days: 14

  # ─── Documentation ──────────────────────────────────
  docs:
    name: Documentation coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Vérifier la cohérence docs ↔ code
        run: npm run docs:check

  # ─── Tests backend ────────────────────────────────────
  test-backend:
    name: Tests backend (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ─── L1 stabilisation : check syntaxique strict ────
      # Bloque accolades non fermées, blocs incomplets, fragments orphelins
      # avant même de lancer les tests.
      - name: Vérification syntaxique backend (node --check)
        run: npm run check:syntax

      # ─── L2 stabilisation : smoke boot backend ─────────
      # Vérifie que le backend démarre + répond /api/health.
      - name: Smoke boot backend
        env:
          JWT_SECRET: smoke-test-secret-key-min-32-chars-long-xx
          DISABLE_SCHEDULER: '1'
        run: npm run smoke-boot

      - name: Tests unitaires backend avec couverture
        run: npm run test:coverage 2>&1 | tee /tmp/backend-coverage.txt

      - name: Rapport de couverture backend
        run: |
          COVERAGE_LINE=$(grep "^# all files" /tmp/backend-coverage.txt || true)
          if [ -n "$COVERAGE_LINE" ]; then
            LINE_PCT=$(echo "$COVERAGE_LINE" | awk -F'|' '{gsub(/[[:space:]]/, "", $2); print $2}')
            BRANCH_PCT=$(echo "$COVERAGE_LINE" | awk -F'|' '{gsub(/[[:space:]]/, "", $3); print $3}')
            FUNC_PCT=$(echo "$COVERAGE_LINE" | awk -F'|' '{gsub(/[[:space:]]/, "", $4); print $4}')
            echo "📊 Backend — Lignes : ${LINE_PCT}% | Branches : ${BRANCH_PCT}% | Fonctions : ${FUNC_PCT}%"
          fi

  # ─── Tests frontend ───────────────────────────────────
  test-frontend:
    name: Tests frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tests Vitest avec coverage
        run: npm run test:coverage --workspace=apps/web

      - name: Rapport de couverture
        run: |
          COVERAGE_FILE=apps/web/coverage/coverage-summary.json
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "⚠️  Fichier de couverture non trouvé"
            exit 0
          fi
          LINES=$(node -e "const c=JSON.parse(require('fs').readFileSync('$COVERAGE_FILE','utf8'));console.log(c.total.lines.pct)")
          BRANCHES=$(node -e "const c=JSON.parse(require('fs').readFileSync('$COVERAGE_FILE','utf8'));console.log(c.total.branches.pct)")
          echo "📊 Couverture lignes : ${LINES}%"
          echo "📊 Couverture branches : ${BRANCHES}%"
          echo "ℹ️  Objectif : augmentation progressive (baseline ~3.7%)"

      - name: Upload rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 14

  # ─── Build ────────────────────────────────────────────
  # FIX CI : build découplé du lint pour ne plus être skippé sur erreurs
  # cosmétiques. Reste dépendant des tests pour ne pas livrer du code cassé.
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # FIX CI : cache du répertoire .vite pour accélérer les rebuilds.
      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules/.vite
            apps/web/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json', 'apps/web/vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Build production
        run: npm run build

      - name: Vérifier le build
        run: |
          if [ ! -d "apps/web/dist" ]; then
            echo "❌ Le dossier dist/ n'a pas été créé"
            exit 1
          fi
          FILE_COUNT=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          echo "✅ Build réussi : $FILE_COUNT fichiers générés"
