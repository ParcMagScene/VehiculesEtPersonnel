# ─────────────────────────────────────────────────────────────
# protect-prod.yml — Verifications additionnelles sur PR vers main
# ─────────────────────────────────────────────────────────────
# Le pipeline `ci.yml` couvre deja lint + tests + build sur les PR
# vers main. Ce workflow ajoute uniquement des controles specifiques
# a la production :
#   • aucun fichier de base de donnees commit
#   • detection de secrets potentiels dans le diff
#   • presence du label `safe-to-merge` (informatif)
# ─────────────────────────────────────────────────────────────

name: Protection branche production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── Verifications de securite ────────────────────────────────
  safety-checks:
    name: Verifications de securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Aucun fichier DB versionne
        run: |
          DB_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(db|sqlite3|sqlite)$' || true)
          if [ -n "$DB_FILES" ]; then
            echo "::error::Fichiers de base de donnees inclus dans la PR :"
            echo "$DB_FILES"
            exit 1
          fi
          echo "Aucun fichier DB detecte"

      - name: Pas de secrets en clair
        run: |
          SECRETS=$(git diff origin/main...HEAD | grep -iE '(password|secret|api_key|token|private_key)\s*[:=]\s*["\x27][^"\x27]{8,}' || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::Secrets potentiels detectes dans le diff"
            exit 1
          fi
          echo "Aucun secret detecte"

      - name: Resume des changements
        run: |
          FILES_CHANGED=$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')
          INSERTIONS=$(git diff --shortstat origin/main...HEAD | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          DELETIONS=$(git diff --shortstat origin/main...HEAD | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")
          echo "Fichiers modifies : $FILES_CHANGED"
          echo "Insertions        : +$INSERTIONS"
          echo "Suppressions      : -$DELETIONS"

  # ─── Label safe-to-merge (NON BLOQUANT) ──────────────────────
  # Informatif : la presence du label est conseillee mais ne bloque pas
  # la PR (pour eviter les boucles label/unlabel sur PR de hotfix).
  label-check:
    name: Label safe-to-merge (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Verifier le label safe-to-merge
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "safe-to-merge"; then
            echo "Label safe-to-merge present"
          else
            echo "::warning::Label safe-to-merge absent — ajouter apres validation manuelle"
            echo "  gh pr edit ${{ github.event.pull_request.number }} --add-label safe-to-merge"
            exit 1
          fi
