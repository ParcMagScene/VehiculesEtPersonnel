name: ✅ Validation main

# Déclenché quand un push arrive sur main (après merge PR dev → main).
# Ce workflow ne déploie PAS : le déploiement réel est effectué localement
# via `npm run deploy` (PM2). Il sert de filet de sécurité post-merge.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-main
  cancel-in-progress: false

jobs:
  validate:
    name: ✅ Validation post-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: ESLint + Prettier
        run: |
          npm run lint
          npm run format:check

      - name: Vérifier la cohérence docs ↔ code
        run: npm run docs:check

      - name: Tests backend
        run: npm test

      - name: Tests frontend
        run: npm run test --workspace=apps/web

      - name: Build production
        run: npm run build

      - name: Vérifier le build
        run: |
          if [ ! -d "apps/web/dist" ]; then
            echo "❌ dist/ manquant"
            exit 1
          fi
          FILE_COUNT=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          echo "✅ Build OK : $FILE_COUNT fichiers"
          echo "ℹ️ Le déploiement réel se fait localement via 'npm run deploy'."
