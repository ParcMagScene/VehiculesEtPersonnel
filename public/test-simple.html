<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2.5rem; }
        .success { color: #10b981; font-size: 3rem; }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        button:hover {
            transform: scale(1.05);
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✅ Test de Connexion</h1>
        <p class="success">SI VOUS VOYEZ CETTE PAGE, LE SERVEUR FONCTIONNE !</p>
    </div>

    <div class="box">
        <h2>🔍 Tests Interactifs</h2>
        <button onclick="testLocalStorage()">Test LocalStorage</button>
        <button onclick="testIndexedDB()">Test IndexedDB</button>
        <button onclick="testFetch()">Test Chargement Données</button>
        <button onclick="testGoogle()">Test Google API</button>
        <div id="result"></div>
    </div>

    <div class="box">
        <h2>📊 Informations Navigateur</h2>
        <p><strong>URL:</strong> <span id="url"></span></p>
        <p><strong>User Agent:</strong> <span id="ua"></span></p>
        <p><strong>Largeur écran:</strong> <span id="width"></span> px</p>
    </div>

    <script>
        const result = document.getElementById('result');
        
        // Afficher les infos
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('width').textContent = window.innerWidth;

        function showResult(message, isSuccess) {
            result.innerHTML = `
                <div style="padding: 20px; background: ${isSuccess ? '#10b981' : '#ef4444'}; 
                     border-radius: 8px; margin-top: 20px;">
                    <strong>${isSuccess ? '✅' : '❌'} ${message}</strong>
                </div>
            `;
        }

        async function testLocalStorage() {
            try {
                localStorage.setItem('test', 'ok');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                showResult('LocalStorage fonctionne !', true);
            } catch (e) {
                showResult('LocalStorage BLOQUÉ: ' + e.message, false);
            }
        }

        async function testIndexedDB() {
            try {
                const request = indexedDB.open('TestDB', 1);
                request.onsuccess = () => {
                    showResult('IndexedDB fonctionne !', true);
                    indexedDB.deleteDatabase('TestDB');
                };
                request.onerror = () => {
                    showResult('IndexedDB BLOQUÉ: ' + request.error, false);
                };
            } catch (e) {
                showResult('IndexedDB ERROR: ' + e.message, false);
            }
        }

        async function testFetch() {
            try {
                const response = await fetch('/initial_data.json');
                const data = await response.json();
                showResult(`Données chargées ! ${data.vehicles.length} véhicules trouvés`, true);
            } catch (e) {
                showResult('Erreur chargement données: ' + e.message, false);
            }
        }

        function testGoogle() {
            if (window.google && window.google.accounts) {
                showResult('Google Identity Services chargé !', true);
            } else {
                showResult('Google Identity Services NON chargé (attendre 2 secondes...)', false);
                setTimeout(() => {
                    if (window.google && window.google.accounts) {
                        showResult('Google Identity Services chargé (après délai) !', true);
                    } else {
                        showResult('Google Identity Services toujours NON chargé', false);
                    }
                }, 2000);
            }
        }
    </script>
</body>
</html>
