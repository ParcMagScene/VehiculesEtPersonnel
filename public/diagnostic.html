<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic - Véhicules</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ccc;
        }
        .test.success {
            border-left-color: #10b981;
        }
        .test.error {
            border-left-color: #ef4444;
        }
        .test.warning {
            border-left-color: #f59e0b;
        }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 0; }
        pre {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .status { font-weight: bold; }
        .success .status { color: #10b981; }
        .error .status { color: #ef4444; }
        .warning .status { color: #f59e0b; }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <h1>🔍 Diagnostic Application Véhicules</h1>
    <div id="results"></div>
    <button onclick="runTests()">🔄 Relancer les tests</button>

    <script>
        const results = document.getElementById('results');

        function addTest(title, status, message, details = '') {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <h2>${title}</h2>
                <p class="status">${status === 'success' ? '✅ OK' : status === 'error' ? '❌ ERREUR' : '⚠️ ATTENTION'}</p>
                <p>${message}</p>
                ${details ? `<pre>${details}</pre>` : ''}
            `;
            results.appendChild(div);
        }

        async function runTests() {
            results.innerHTML = '<p>Tests en cours...</p>';

            // Test 1: IndexedDB
            try {
                const dbRequest = indexedDB.open('ReservationVehicules', 4);
                await new Promise((resolve, reject) => {
                    dbRequest.onsuccess = resolve;
                    dbRequest.onerror = reject;
                });
                addTest('IndexedDB', 'success', 'IndexedDB est disponible et accessible');
            } catch (error) {
                addTest('IndexedDB', 'error', 'IndexedDB non accessible', error.toString());
            }

            // Test 2: Fetch initial_data.json
            try {
                const response = await fetch('/initial_data.json');
                const data = await response.json();
                const vehicleCount = data.vehicles ? data.vehicles.length : 0;
                addTest('Données initiales', 'success', 
                    `Fichier initial_data.json accessible (${vehicleCount} véhicules)`,
                    `Premiers véhicules: ${data.vehicles.slice(0, 3).map(v => v.name).join(', ')}`
                );
            } catch (error) {
                addTest('Données initiales', 'error', 'Impossible de charger initial_data.json', error.toString());
            }

            // Test 3: LocalStorage
            try {
                localStorage.setItem('test', 'ok');
                const test = localStorage.getItem('test');
                localStorage.removeItem('test');
                if (test === 'ok') {
                    const googleToken = localStorage.getItem('google_access_token');
                    addTest('LocalStorage', 'success', 
                        googleToken ? 'LocalStorage OK - Token Google présent' : 'LocalStorage OK - Pas de token Google',
                        googleToken ? `Token: ${googleToken.substring(0, 20)}...` : ''
                    );
                } else {
                    throw new Error('Test failed');
                }
            } catch (error) {
                addTest('LocalStorage', 'error', 'LocalStorage non accessible', error.toString());
            }

            // Test 4: Navigation
            addTest('URL actuelle', 'success', 
                `Vous accédez depuis: ${window.location.href}`,
                `User Agent: ${navigator.userAgent}`
            );

            // Test 5: Réseau
            try {
                const response = await fetch('/assets/index-X2hA3pp7.js', { method: 'HEAD' });
                if (response.ok) {
                    addTest('Fichiers JavaScript', 'success', 'Le fichier JS principal est accessible');
                } else {
                    addTest('Fichiers JavaScript', 'warning', 'Problème de chargement du JS', `Status: ${response.status}`);
                }
            } catch (error) {
                addTest('Fichiers JavaScript', 'error', 'JS non accessible', error.toString());
            }

            // Test 6: Google API
            if (window.google && window.google.accounts) {
                addTest('Google API', 'success', 'Google Identity Services chargé');
            } else {
                addTest('Google API', 'warning', 'Google Identity Services non chargé (normal au démarrage)');
            }

            // Test 7: Console Errors
            const errors = [];
            const originalError = console.error;
            console.error = function(...args) {
                errors.push(args.join(' '));
                originalError.apply(console, args);
            };

            setTimeout(() => {
                if (errors.length > 0) {
                    addTest('Erreurs Console', 'warning', 
                        `${errors.length} erreur(s) détectée(s)`,
                        errors.join('\n')
                    );
                } else {
                    addTest('Erreurs Console', 'success', 'Aucune erreur détectée');
                }
            }, 2000);
        }

        // Lancer les tests au chargement
        runTests();
    </script>
</body>
</html>
