<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration IndexedDB → SQLite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .step {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .step-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .status.info {
            background: #d1ecf1;
            border: 1px solid #17a2b8;
            color: #0c5460;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
        }

        .progress {
            margin-top: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Migration des données</h1>
        <p class="subtitle">Migrez vos données d'IndexedDB vers la base de données SQLite centralisée</p>

        <div class="step">
            <div class="step-title">Étape 1 : Connexion</div>
            <p>Connectez-vous avec votre compte pour effectuer la migration</p>
            
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Mot de passe" />
        </div>

        <div class="step">
            <div class="step-title">Étape 2 : Migration</div>
            <p>Toutes les données d'IndexedDB seront transférées vers SQLite</p>
            
            <button id="migrateBtn" onclick="startMigration()">Démarrer la migration</button>
        </div>

        <div id="status"></div>

        <div id="progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div id="details"></div>
    </div>

    <script>
        const DB_NAME = 'ReservationVehicules';
        const DB_VERSION = 4;
        const STORES = {
          vehicles: 'vehicles',
          reservations: 'reservations',
          clients: 'clients',
          drivers: 'drivers',
          locations: 'locations',
          garages: 'garages',
          maintenances: 'maintenances',
        };

        let authToken = null;

        function setStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        function updateProgress(percent, text) {
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        function showDetails(data) {
            const detailsDiv = document.getElementById('details');
            detailsDiv.innerHTML = '<div class="step"><div class="step-title">Détails de la migration</div><pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                setStatus('Veuillez entrer votre email et mot de passe', 'error');
                return false;
            }

            try {
                const response = await fetch('http://192.168.205.75:3002/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Erreur de connexion');
                }

                authToken = data.token;
                setStatus(`✅ Connecté en tant que ${data.user.name}`, 'success');
                return true;
            } catch (error) {
                setStatus('❌ ' + error.message, 'error');
                return false;
            }
        }

        async function loadFromIndexedDB(storeName) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                
                request.onsuccess = () => {
                    const db = request.result;
                    
                    if (!db.objectStoreNames.contains(storeName)) {
                        resolve([]);
                        return;
                    }
                    
                    const transaction = db.transaction(storeName, 'readonly');
                    const store = transaction.objectStore(storeName);
                    const getAllRequest = store.getAll();
                    
                    getAllRequest.onsuccess = () => {
                        db.close();
                        resolve(getAllRequest.result || []);
                    };
                    
                    getAllRequest.onerror = () => {
                        db.close();
                        reject(getAllRequest.error);
                    };
                };
            });
        }

        async function migrateStore(storeName, apiEndpoint) {
            setStatus(`🔄 Migration de ${storeName}...`, 'info');
            
            const data = await loadFromIndexedDB(storeName);
            
            if (data.length === 0) {
                return { store: storeName, count: 0, skipped: true };
            }

            let successCount = 0;
            let errorCount = 0;

            for (const item of data) {
                try {
                    const response = await fetch(`http://192.168.205.75:3002/api/${apiEndpoint}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify(item)
                    });

                    if (response.ok) {
                        successCount++;
                    } else {
                        errorCount++;
                    }
                } catch (error) {
                    errorCount++;
                }
            }

            return { store: storeName, total: data.length, success: successCount, errors: errorCount };
        }

        async function startMigration() {
            // Connexion
            const loggedIn = await login();
            if (!loggedIn) return;

            document.getElementById('migrateBtn').disabled = true;
            updateProgress(0, 'Démarrage de la migration...');

            try {
                const migrations = [
                    { store: 'vehicles', endpoint: 'vehicles' },
                    { store: 'clients', endpoint: 'clients' },
                    { store: 'drivers', endpoint: 'drivers' },
                    { store: 'locations', endpoint: 'locations' },
                    { store: 'garages', endpoint: 'garages' },
                    { store: 'reservations', endpoint: 'reservations' },
                    { store: 'maintenances', endpoint: 'maintenances' },
                ];

                const results = [];
                const total = migrations.length;

                for (let i = 0; i < migrations.length; i++) {
                    const { store, endpoint } = migrations[i];
                    const percent = Math.round(((i + 1) / total) * 100);
                    
                    updateProgress(percent, `Migration de ${store}... (${i + 1}/${total})`);
                    
                    const result = await migrateStore(store, endpoint);
                    results.push(result);
                }

                updateProgress(100, '✅ Migration terminée !');
                setStatus('✅ Migration réussie !', 'success');
                showDetails(results);

            } catch (error) {
                setStatus('❌ Erreur : ' + error.message, 'error');
            } finally {
                document.getElementById('migrateBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
