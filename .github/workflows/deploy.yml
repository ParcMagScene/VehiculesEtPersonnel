name: 🚀 Deploy production

# Déclenché quand un push arrive sur main (après merge PR dev → main)
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Validation avant deploy ──────────────────────────
  validate:
    name: ✅ Validation pré-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint + Prettier
        run: |
          npm run lint
          npm run format:check

      - name: Vérifier la cohérence docs ↔ code
        run: npm run docs:check

      - name: Tests backend
        run: npm test

      - name: Tests frontend
        run: npm run test --workspace=apps/web

      - name: Build production
        run: npm run build

      - name: Vérifier le build
        run: |
          if [ ! -d "apps/web/dist" ]; then
            echo "❌ dist/ manquant"
            exit 1
          fi
          FILE_COUNT=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          echo "✅ Build OK : $FILE_COUNT fichiers"

  # ─── Déploiement SSH vers le serveur ──────────────────
  deploy:
    name: 🚀 Déploiement production
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build production
        run: npm run build

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/emag' }}
            
            echo "📥 Pull des derniers changements..."
            git pull origin main
            
            echo "📦 Installation des dépendances..."
            npm ci --production
            
            echo "🔨 Build frontend..."
            npm run build
            
            echo "🔄 Redémarrage des services..."
            pm2 restart vehicules vehicules-backend
            
            echo "🩺 Smoke test..."
            sleep 3
            HEALTH=$(curl -sf http://localhost:3002/api/health 2>/dev/null || echo '{"ok":false}')
            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ API opérationnelle"
            else
              echo "⚠️  L'API ne répond pas — vérifier pm2 logs"
              exit 1
            fi
            
            echo "✅ Déploiement production terminé !"
