<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard</title>

    <!-- Favicon et icônes pour raccourcis mobile -->
    <link rel="icon" type="image/png" href="/display-logo/logo.png">
    <link rel="apple-touch-icon" href="/display-logo/logo.png">
    <link rel="manifest" href="/tv-client/manifest.json">
    <meta name="theme-color" content="#00e1ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">

    <link rel="stylesheet" href="/tv-client/styles.css?v=20260424">
    <style>
        :root {
            --primary-color: #00e1ff;
            --secondary-color: #000000;
            --event-bg-color: #000000;
            --event-text-color: #ffffff;
            --font-family: 'Segoe UI', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!--
      TV scaling : tout le dashboard TV est encapsule dans #tv-root.tv-scale
      pour permettre un agrandissement global (TV 65" UHD, lecture a 4-5 m).
      Le facteur d'echelle par defaut est defini en CSS (var --tv-scale)
      puis surcharge dynamiquement depuis display_config.tvScale.
      Voir docs/tv-client-scaling.md.
    -->
    <div id="tv-root" class="tv-scale">
    <!-- Navigation mobile par onglets (visible uniquement sur mobile) -->
    <nav id="mobile-tabs">
        <button class="tab-btn active" data-tab="events">📅 Événements</button>
        <button class="tab-btn" data-tab="recurrent">🔄 Récurrents</button>

    </nav>

    <header id="header">
      <img id="logo" src="/display-logo/logo.png" alt="Logo entreprise">
      <h1 id="welcome" class="marquee">Chargement du message...</h1>
      <div id="datetime">
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 1em;">
          <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <span id="date"></span>
            <span id="heure"></span>
          </div>
          <span id="weather"></span>
        </div>
      </div>
    </header>

    <main>
      <!-- Onglet Événements -->
      <section class="events-section tab-content active" id="tab-events">
        <div class="events-container">
          <ul id="regular-events-list" class="events-list">
            <li>Chargement des événements...</li>
          </ul>
        </div>
      </section>

      <!-- Onglet Récurrents -->
      <section class="recurrent-events-section tab-content" id="tab-recurrent">
        <div class="recurrent-events-container">
          <ul id="recurrent-events-list" class="recurrent-events-list">
            <!-- Les événements récurrents seront ajoutés ici -->
          </ul>
        </div>
      </section>


    </main>

    <!-- Widget Sonos en bas de l'écran -->
    <div id="sonos-widget" style="display: none;">
      <div id="sonos-artwork-wrap">
        <img id="sonos-album-art" src="" alt="Album">
        <img id="sonos-service-badge" src="" alt="" style="display: none;">
      </div>
      <div id="sonos-info">
        <div id="sonos-title"></div>
        <div id="sonos-artist"></div>
      </div>
    </div>

    <!-- Indicateur offline -->
    <div id="offline-indicator" style="display: none;">
      <span>📡 Connexion perdue — données en cache</span>
    </div>

    <footer></footer>

    </div><!-- /#tv-root.tv-scale -->

    <script src="/tv-client/main.js?v=20260424"></script>
    <script>
      // Gestion des onglets mobile
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          const tabId = 'tab-' + btn.dataset.tab;
          document.getElementById(tabId).classList.add('active');
        });
      });
    </script>
</body>
</html>
